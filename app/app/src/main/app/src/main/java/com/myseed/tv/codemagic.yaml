
workflows:
  myseed-tv:
    name: MySeed TV APK
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Build Android APK
        script: |
          gradle --version
          gradle assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
